<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rumo5 - Início</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      max-width: 400px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }

    a.button {
      text-decoration: none;
      padding: 14px;
      background-color: #ffffff;
      color: #2a5298;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
      font-size: 1rem;
    }

    a.button:hover {
      background-color: #2a5298;
      color: #ffffff;
    }

    footer {
      margin-top: auto;
      font-size: 0.8rem;
      opacity: 0.7;
      padding-bottom: 10px;
    }

    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
        justify-content: center;
        max-width: none;
      }

      a.button {
        width: auto;
        min-width: 150px;
      }
    }
  </style>
</head>
<body>
  <h1>Bem-vindo à Rumo5</h1>
  <p>Explore nossas soluções e conheça nosso vídeo de apresentação.</p>
  <div class="buttons">
    <a class="button" href="/apresentacao">Ver Apresentação</a>
    <a class="button" href="mailto:contato@rumo5.com.br">Contato</a>
  </div>
  <footer>© 2025 Rumo5. Todos os direitos reservados.</footer>
</body>
</html>
